services:
  web:
    build: .
    ports:
      - "3333:3000"
    environment:
      - NODE_ENV=production
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - RATE_LIMIT_MAX=10
      - RATE_LIMIT_WINDOW_MS=60000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
