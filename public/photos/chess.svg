<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <!-- Polaroid frame -->
  <rect width="300" height="380" rx="4" fill="white" />
  <rect x="10" y="10" width="280" height="300" fill="#1a120b" />

  <!-- Chess board -->
  <rect x="30" y="30" width="240" height="240" fill="#d4a56a" rx="4"/>
  <!-- Dark squares (8x8 board, each square ~30px) -->
  <g fill="#5c2e0a">
    <!-- row 1 -->
    <rect x="30" y="30" width="30" height="30"/>
    <rect x="90" y="30" width="30" height="30"/>
    <rect x="150" y="30" width="30" height="30"/>
    <rect x="210" y="30" width="30" height="30"/>
    <!-- row 2 -->
    <rect x="60" y="60" width="30" height="30"/>
    <rect x="120" y="60" width="30" height="30"/>
    <rect x="180" y="60" width="30" height="30"/>
    <rect x="240" y="60" width="30" height="30"/>
    <!-- row 3 -->
    <rect x="30" y="90" width="30" height="30"/>
    <rect x="90" y="90" width="30" height="30"/>
    <rect x="150" y="90" width="30" height="30"/>
    <rect x="210" y="90" width="30" height="30"/>
    <!-- row 4 -->
    <rect x="60" y="120" width="30" height="30"/>
    <rect x="120" y="120" width="30" height="30"/>
    <rect x="180" y="120" width="30" height="30"/>
    <rect x="240" y="120" width="30" height="30"/>
    <!-- row 5 -->
    <rect x="30" y="150" width="30" height="30"/>
    <rect x="90" y="150" width="30" height="30"/>
    <rect x="150" y="150" width="30" height="30"/>
    <rect x="210" y="150" width="30" height="30"/>
    <!-- row 6 -->
    <rect x="60" y="180" width="30" height="30"/>
    <rect x="120" y="180" width="30" height="30"/>
    <rect x="180" y="180" width="30" height="30"/>
    <rect x="240" y="180" width="30" height="30"/>
    <!-- row 7 -->
    <rect x="30" y="210" width="30" height="30"/>
    <rect x="90" y="210" width="30" height="30"/>
    <rect x="150" y="210" width="30" height="30"/>
    <rect x="210" y="210" width="30" height="30"/>
    <!-- row 8 -->
    <rect x="60" y="240" width="30" height="30"/>
    <rect x="120" y="240" width="30" height="30"/>
    <rect x="180" y="240" width="30" height="30"/>
    <rect x="240" y="240" width="30" height="30"/>
  </g>
  <!-- Board border -->
  <rect x="30" y="30" width="240" height="240" fill="none" stroke="#3d1a04" stroke-width="3" rx="4"/>

  <!-- White knight on d5 (square 4,4 → x=120+15=135, y=120+15=135) -->
  <!-- Knight body -->
  <g transform="translate(135, 135)">
    <ellipse cx="0" cy="15" rx="18" ry="8" fill="#f0e6d3"/>
    <rect x="-10" y="-5" width="20" height="22" rx="4" fill="#f0e6d3"/>
    <ellipse cx="0" cy="-5" rx="11" ry="13" fill="#f0e6d3"/>
    <!-- Knight face/mane -->
    <ellipse cx="4" cy="-14" rx="8" ry="10" fill="#f0e6d3"/>
    <circle cx="7" cy="-16" r="2.5" fill="#1a120b"/>
    <path d="M-6,-8 Q-12,-15 -8,-22 Q0,-18 4,-22 Q8,-16 5,-8" fill="#d4c4aa"/>
    <ellipse cx="-3" cy="-7" rx="5" ry="3" fill="#c8b090" opacity="0.6"/>
  </g>

  <!-- Black king on e1 square (x=150, y=270) -->
  <g transform="translate(165, 255)">
    <ellipse cx="0" cy="14" rx="16" ry="6" fill="#1a1a1a"/>
    <rect x="-9" y="-2" width="18" height="18" rx="3" fill="#1a1a1a"/>
    <ellipse cx="0" cy="-2" rx="9" ry="11" fill="#1a1a1a"/>
    <!-- Crown cross -->
    <line x1="0" y1="-14" x2="0" y2="-24" stroke="#f0e6d3" stroke-width="3" stroke-linecap="round"/>
    <line x1="-5" y1="-19" x2="5" y2="-19" stroke="#f0e6d3" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Label area -->
  <text x="150" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Chess · Rated ~1800</text>
  <text x="150" y="365" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Daily player · Chess.com</text>
</svg>
