<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <!-- Polaroid frame -->
  <rect width="300" height="380" rx="4" fill="white" />
  <!-- Library / book background -->
  <rect x="10" y="10" width="280" height="300" fill="#1e1206" />

  <!-- Warm lamp glow -->
  <defs>
    <radialGradient id="lampglow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="280" height="300" fill="url(#lampglow)"/>

  <!-- Bookshelf back wall -->
  <rect x="10" y="10" width="280" height="155" fill="#2a1505"/>

  <!-- Shelf planks -->
  <rect x="10" y="80" width="280" height="8" fill="#3d1a04"/>
  <rect x="10" y="155" width="280" height="8" fill="#3d1a04"/>

  <!-- Books on top shelf -->
  <!-- Book 1 -->
  <rect x="20" y="30" width="22" height="52" rx="2" fill="#1d4ed8"/>
  <rect x="20" y="30" width="4" height="52" fill="#1e40af"/>
  <rect x="22" y="45" width="18" height="3" rx="1" fill="#93c5fd" opacity="0.6"/>
  <!-- Book 2 -->
  <rect x="44" y="35" width="18" height="47" rx="2" fill="#dc2626"/>
  <rect x="44" y="35" width="3" height="47" fill="#b91c1c"/>
  <!-- Book 3 -->
  <rect x="64" y="28" width="24" height="54" rx="2" fill="#d97706"/>
  <rect x="64" y="28" width="4" height="54" fill="#b45309"/>
  <rect x="66" y="42" width="20" height="3" rx="1" fill="#fcd34d" opacity="0.7"/>
  <!-- Book 4 (leaning) -->
  <rect x="89" y="33" width="16" height="49" rx="2" fill="#059669" transform="rotate(-5,97,57)"/>
  <!-- Book 5 -->
  <rect x="110" y="30" width="20" height="52" rx="2" fill="#7c3aed"/>
  <rect x="110" y="30" width="3" height="52" fill="#6d28d9"/>
  <!-- Book 6 -->
  <rect x="132" y="38" width="16" height="44" rx="2" fill="#db2777"/>
  <!-- Book 7 -->
  <rect x="150" y="28" width="22" height="54" rx="2" fill="#0891b2"/>
  <rect x="150" y="28" width="4" height="54" fill="#0e7490"/>
  <rect x="152" y="48" width="18" height="3" rx="1" fill="#67e8f9" opacity="0.6"/>
  <!-- Book 8 -->
  <rect x="175" y="32" width="18" height="50" rx="2" fill="#ca8a04"/>
  <!-- Book 9 -->
  <rect x="196" y="27" width="24" height="55" rx="2" fill="#16a34a"/>
  <rect x="196" y="27" width="4" height="55" fill="#15803d"/>
  <!-- Book 10 -->
  <rect x="223" y="35" width="16" height="47" rx="2" fill="#9333ea"/>
  <!-- Book 11 -->
  <rect x="241" y="30" width="20" height="52" rx="2" fill="#e11d48"/>
  <rect x="241" y="30" width="3" height="52" fill="#be123c"/>
  <!-- Book 12 -->
  <rect x="263" y="28" width="17" height="54" rx="2" fill="#0369a1"/>

  <!-- Books on bottom shelf -->
  <!-- A few books stacked -->
  <rect x="20" y="105" width="25" height="52" rx="2" fill="#78350f"/>
  <rect x="47" y="110" width="20" height="47" rx="2" fill="#1e3a8a"/>
  <rect x="68" y="103" width="18" height="54" rx="2" fill="#166534"/>
  <rect x="88" y="107" width="22" height="50" rx="2" fill="#7f1d1d"/>
  <rect x="112" y="105" width="15" height="52" rx="2" fill="#713f12"/>
  <!-- Stack of books lying flat -->
  <rect x="195" y="128" width="40" height="12" rx="2" fill="#0c4a6e"/>
  <rect x="193" y="118" width="40" height="12" rx="2" fill="#1e3a8a"/>
  <rect x="197" y="108" width="36" height="12" rx="2" fill="#312e81"/>
  <!-- Reading pile (leaning) -->
  <rect x="240" y="105" width="18" height="52" rx="2" fill="#064e3b" transform="rotate(8,249,131)"/>
  <rect x="260" y="108" width="20" height="49" rx="2" fill="#14532d"/>

  <!-- Reading desk area -->
  <rect x="10" y="163" width="280" height="147" fill="#2a1505"/>
  <!-- Desk surface -->
  <rect x="30" y="215" width="240" height="12" rx="3" fill="#3d1a04"/>
  <!-- Book open on desk -->
  <path d="M80,185 L150,185 L150,215 Q115,218 80,215 Z" fill="#f5f0e8"/>
  <path d="M150,185 L220,185 L220,215 Q185,218 150,215 Z" fill="#f0ebe0"/>
  <!-- Page lines left -->
  <line x1="90" y1="193" x2="145" y2="193" stroke="#d4c8b0" stroke-width="1.2"/>
  <line x1="90" y1="199" x2="145" y2="199" stroke="#d4c8b0" stroke-width="1.2"/>
  <line x1="90" y1="205" x2="140" y2="205" stroke="#d4c8b0" stroke-width="1.2"/>
  <!-- Page lines right -->
  <line x1="155" y1="193" x2="210" y2="193" stroke="#cec2aa" stroke-width="1.2"/>
  <line x1="155" y1="199" x2="210" y2="199" stroke="#cec2aa" stroke-width="1.2"/>
  <line x1="155" y1="205" x2="205" y2="205" stroke="#cec2aa" stroke-width="1.2"/>
  <!-- Book spine -->
  <line x1="150" y1="185" x2="150" y2="215" stroke="#c0aa88" stroke-width="3"/>

  <!-- Desk lamp -->
  <circle cx="240" cy="185" r="18" fill="#f59e0b" opacity="0.3"/>
  <circle cx="240" cy="185" r="10" fill="#fbbf24" opacity="0.5"/>
  <line x1="240" y1="195" x2="240" y2="215" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
  <rect x="228" y="175" width="24" height="14" rx="7" fill="#fbbf24" opacity="0.8" transform="rotate(-15,240,182)"/>

  <!-- Label area -->
  <text x="150" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Reading · ~30 Books/Year</text>
  <text x="150" y="365" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Tech · Sci-Fi · Armenian Lit</text>
</svg>
