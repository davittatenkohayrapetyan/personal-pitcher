<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <!-- Polaroid frame -->
  <rect width="300" height="380" rx="4" fill="white" />
  <!-- Dark terminal background -->
  <rect x="10" y="10" width="280" height="300" fill="#0d1117" />

  <!-- Laptop base -->
  <rect x="30" y="200" width="240" height="12" rx="3" fill="#374151"/>
  <rect x="20" y="208" width="260" height="6" rx="3" fill="#4b5563"/>

  <!-- Laptop screen frame -->
  <rect x="45" y="70" width="210" height="140" rx="8" fill="#1f2937"/>
  <rect x="50" y="75" width="200" height="130" rx="5" fill="#111827"/>

  <!-- Screen glow -->
  <rect x="50" y="75" width="200" height="130" rx="5" fill="#0ea5e9" opacity="0.03"/>

  <!-- Terminal content -->
  <!-- Line 1 -->
  <rect x="60" y="88" width="15" height="7" rx="2" fill="#10b981"/>
  <rect x="80" y="88" width="60" height="7" rx="2" fill="#e2e8f0"/>
  <rect x="145" y="88" width="30" height="7" rx="2" fill="#60a5fa"/>
  <rect x="180" y="88" width="40" height="7" rx="2" fill="#a78bfa"/>

  <!-- Line 2 -->
  <rect x="60" y="102" width="20" height="7" rx="2" fill="#f59e0b" opacity="0.8"/>
  <rect x="85" y="102" width="50" height="7" rx="2" fill="#e2e8f0" opacity="0.7"/>
  <rect x="140" y="102" width="70" height="7" rx="2" fill="#e2e8f0" opacity="0.5"/>

  <!-- Line 3 -->
  <rect x="70" y="116" width="30" height="7" rx="2" fill="#34d399"/>
  <rect x="105" y="116" width="45" height="7" rx="2" fill="#60a5fa"/>
  <rect x="155" y="116" width="55" height="7" rx="2" fill="#e2e8f0" opacity="0.6"/>

  <!-- Line 4 -->
  <rect x="70" y="130" width="25" height="7" rx="2" fill="#f472b6"/>
  <rect x="100" y="130" width="35" height="7" rx="2" fill="#e2e8f0" opacity="0.7"/>
  <rect x="140" y="130" width="50" height="7" rx="2" fill="#a78bfa"/>

  <!-- Line 5 -->
  <rect x="60" y="144" width="15" height="7" rx="2" fill="#10b981"/>
  <rect x="80" y="144" width="80" height="7" rx="2" fill="#e2e8f0" opacity="0.6"/>
  <rect x="165" y="144" width="40" height="7" rx="2" fill="#60a5fa" opacity="0.8"/>

  <!-- Line 6 blank/comment -->
  <rect x="60" y="158" width="120" height="7" rx="2" fill="#4b5563"/>

  <!-- Line 7 -->
  <rect x="60" y="172" width="10" height="7" rx="2" fill="#10b981"/>
  <!-- blinking cursor -->
  <rect x="75" y="172" width="8" height="7" rx="1" fill="#e2e8f0">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Screen shine -->
  <rect x="50" y="75" width="200" height="40" rx="5" fill="white" opacity="0.02"/>

  <!-- Keyboard hint -->
  <rect x="55" y="218" width="18" height="10" rx="2" fill="#4b5563"/>
  <rect x="78" y="218" width="18" height="10" rx="2" fill="#4b5563"/>
  <rect x="101" y="218" width="18" height="10" rx="2" fill="#374151"/>
  <rect x="124" y="218" width="52" height="10" rx="2" fill="#374151"/>
  <rect x="181" y="218" width="18" height="10" rx="2" fill="#4b5563"/>
  <rect x="204" y="218" width="18" height="10" rx="2" fill="#4b5563"/>
  <rect x="227" y="218" width="18" height="10" rx="2" fill="#4b5563"/>

  <!-- Coffee mug beside laptop -->
  <rect x="220" y="170" width="32" height="26" rx="3" fill="#7c3aed"/>
  <path d="M252,177 Q264,177 264,183 Q264,189 252,189" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round"/>
  <rect x="220" y="192" width="32" height="4" rx="2" fill="#5b21b6"/>
  <!-- Steam -->
  <path d="M229,167 Q231,160 228,153" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M236,165 Q239,157 236,150" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Label area -->
  <text x="150" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Late-Night Coding</text>
  <text x="150" y="365" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">TypeScript · Go · Kubernetes</text>
</svg>
