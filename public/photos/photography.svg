<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <!-- Polaroid frame -->
  <rect width="300" height="380" rx="4" fill="white" />
  <!-- Warm outdoor/nature background -->
  <rect x="10" y="10" width="280" height="300" fill="#92400e" />

  <defs>
    <radialGradient id="bokeh1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Bokeh background blobs -->
  <circle cx="50" cy="60" r="45" fill="url(#bokeh1)"/>
  <circle cx="230" cy="80" r="55" fill="url(#bokeh2)"/>
  <circle cx="160" cy="200" r="40" fill="url(#bokeh1)" opacity="0.4"/>
  <circle cx="80" cy="220" r="35" fill="url(#bokeh2)" opacity="0.3"/>
  <circle cx="250" cy="240" r="30" fill="url(#bokeh1)" opacity="0.5"/>

  <!-- Blurred foliage background -->
  <ellipse cx="30" cy="300" rx="60" ry="50" fill="#78350f" opacity="0.8"/>
  <ellipse cx="270" cy="300" rx="60" ry="50" fill="#78350f" opacity="0.8"/>

  <!-- Camera body -->
  <rect x="60" y="100" width="180" height="130" rx="14" fill="#1c1917"/>
  <rect x="65" y="105" width="170" height="120" rx="10" fill="#292524"/>

  <!-- Top controls -->
  <rect x="60" y="82" width="50" height="22" rx="6" fill="#1c1917"/>
  <rect x="190" y="84" width="50" height="18" rx="5" fill="#1c1917"/>
  <!-- Mode dial -->
  <circle cx="215" cy="93" r="14" fill="#3d3530"/>
  <circle cx="215" cy="93" r="10" fill="#292524"/>
  <text x="215" y="97" font-family="Arial, sans-serif" font-size="7" fill="#fbbf24" text-anchor="middle" font-weight="bold">A</text>

  <!-- Lens -->
  <circle cx="150" cy="165" r="52" fill="#0c0a09"/>
  <circle cx="150" cy="165" r="46" fill="#1c1917"/>
  <circle cx="150" cy="165" r="40" fill="#0c0a09"/>
  <!-- Lens rings (Sony Alpha style) -->
  <circle cx="150" cy="165" r="36" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="150" cy="165" r="30" fill="#111827"/>
  <circle cx="150" cy="165" r="24" fill="#0a0a0a"/>
  <!-- Inner lens glass -->
  <circle cx="150" cy="165" r="20" fill="#1e3a5f"/>
  <circle cx="150" cy="165" r="14" fill="#1a2c42"/>
  <circle cx="150" cy="165" r="8" fill="#0d1b2e"/>
  <!-- Lens reflection -->
  <ellipse cx="142" cy="157" rx="6" ry="5" fill="white" opacity="0.15" transform="rotate(-25,142,157)"/>

  <!-- Viewfinder -->
  <rect x="195" y="110" width="35" height="22" rx="4" fill="#1c1917"/>
  <rect x="198" y="113" width="29" height="16" rx="2" fill="#0ea5e9" opacity="0.3"/>

  <!-- Shutter button -->
  <circle cx="80" cy="93" r="9" fill="#ef4444"/>
  <circle cx="80" cy="93" r="6" fill="#dc2626"/>

  <!-- SONY label -->
  <text x="150" y="136" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle" letter-spacing="2">SONY α</text>

  <!-- Grip texture lines -->
  <rect x="65" y="108" width="12" height="115" rx="6" fill="#1c1917"/>

  <!-- Label area -->
  <text x="150" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Photography</text>
  <text x="150" y="365" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Sony Alpha · Landscape &amp; Street</text>
</svg>
