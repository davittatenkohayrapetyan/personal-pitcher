<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <!-- Polaroid frame -->
  <rect width="300" height="380" rx="4" fill="white" />
  <!-- Stage background -->
  <rect x="10" y="10" width="280" height="300" fill="#0f172a" />

  <!-- Stage light beams from above -->
  <defs>
    <linearGradient id="beam1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <polygon points="100,10 130,150 70,150" fill="url(#beam1)"/>
  <polygon points="200,10 235,160 165,160" fill="url(#beam2)"/>
  <polygon points="155,10 185,155 125,155" fill="url(#beam1)" opacity="0.6"/>

  <!-- Projection screen at back -->
  <rect x="40" y="30" width="220" height="140" rx="4" fill="#1e293b"/>
  <rect x="40" y="30" width="220" height="140" rx="4" fill="#1d4ed8" opacity="0.15"/>
  <!-- Slide content on screen -->
  <rect x="55" y="45" width="80" height="8" rx="3" fill="#60a5fa" opacity="0.9"/>
  <rect x="55" y="60" width="130" height="6" rx="3" fill="#e2e8f0" opacity="0.5"/>
  <rect x="55" y="73" width="110" height="6" rx="3" fill="#e2e8f0" opacity="0.4"/>
  <rect x="55" y="86" width="90" height="6" rx="3" fill="#e2e8f0" opacity="0.35"/>
  <circle cx="195" cy="80" r="30" fill="#0ea5e9" opacity="0.25"/>
  <circle cx="195" cy="80" r="20" fill="#0ea5e9" opacity="0.2"/>
  <!-- "ArmeniaJS" text on slide -->
  <text x="150" y="118" font-family="Arial, sans-serif" font-size="10" fill="#60a5fa" text-anchor="middle" font-weight="bold" opacity="0.9">ArmeniaJS 2023</text>
  <text x="150" y="132" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle" opacity="0.8">gRPC &amp; TypeScript</text>

  <!-- Stage floor -->
  <rect x="10" y="175" width="280" height="135" fill="#0c1626"/>
  <rect x="10" y="175" width="280" height="4" fill="#334155"/>

  <!-- Podium -->
  <rect x="120" y="150" width="60" height="60" rx="4" fill="#1e293b"/>
  <rect x="115" y="200" width="70" height="10" rx="2" fill="#0f172a"/>
  <rect x="118" y="152" width="64" height="8" rx="2" fill="#334155"/>
  <!-- Microphone -->
  <line x1="150" y1="152" x2="150" y2="130" stroke="#475569" stroke-width="2"/>
  <ellipse cx="150" cy="126" rx="5" ry="7" fill="#374151"/>

  <!-- Speaker silhouette -->
  <circle cx="150" cy="175" r="14" fill="#0ea5e9" opacity="0.9"/>
  <rect x="138" y="189" width="24" height="30" rx="5" fill="#0ea5e9" opacity="0.85"/>
  <!-- Arms -->
  <line x1="138" y1="200" x2="122" y2="195" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <line x1="162" y1="200" x2="178" y2="195" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" opacity="0.85"/>

  <!-- Audience silhouettes in rows -->
  <!-- Row 1 (front) -->
  <circle cx="40" cy="268" r="10" fill="#1e3a5f" opacity="0.9"/>
  <circle cx="70" cy="270" r="10" fill="#1e3a5f" opacity="0.9"/>
  <circle cx="100" cy="267" r="10" fill="#1e3a5f" opacity="0.9"/>
  <circle cx="200" cy="268" r="10" fill="#1e3a5f" opacity="0.9"/>
  <circle cx="230" cy="270" r="10" fill="#1e3a5f" opacity="0.9"/>
  <circle cx="260" cy="267" r="10" fill="#1e3a5f" opacity="0.9"/>
  <!-- Row 2 (back) -->
  <circle cx="25" cy="286" r="8" fill="#152a46" opacity="0.7"/>
  <circle cx="52" cy="288" r="8" fill="#152a46" opacity="0.7"/>
  <circle cx="80" cy="285" r="8" fill="#152a46" opacity="0.7"/>
  <circle cx="215" cy="286" r="8" fill="#152a46" opacity="0.7"/>
  <circle cx="245" cy="288" r="8" fill="#152a46" opacity="0.7"/>
  <circle cx="272" cy="285" r="8" fill="#152a46" opacity="0.7"/>

  <!-- Label area -->
  <text x="150" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Speaking at ArmeniaJS</text>
  <text x="150" y="365" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Conference 2023 · Yerevan</text>
</svg>
